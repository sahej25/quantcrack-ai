<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuantCrack AI · Question Manager</title><link rel="stylesheet" href="styles.css"><style>
.admin-wrap{max-width:900px;margin:36px auto;padding:20px}.admin-card{background:#fff;border:1px solid #dfe8e3;border-radius:18px;padding:24px;margin:18px 0}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.admin-card label{display:block;font-weight:600;margin:10px 0 6px}.admin-card input,.admin-card select,.admin-card textarea{width:100%;padding:12px;border:1px solid #cbd8d1;border-radius:9px;font:inherit}.admin-card textarea{min-height:90px}.admin-card button{margin-top:14px}.admin-row{padding:12px 0;border-bottom:1px solid #e3ebe6}.status{padding:10px;border-radius:8px;background:#f0f7f3;margin:12px 0;white-space:pre-wrap}.danger{background:#fff0ed}.hidden{display:none!important}@media(max-width:650px){.admin-grid{grid-template-columns:1fr}.admin-wrap{padding:12px}}
</style></head><body><main class="admin-wrap"><a href="index.html">← Back to practice site</a><h1>Question Manager</h1><p>Add, edit, publish, or remove questions from your online CAT Quant bank.</p>
<section class="admin-card" id="login-panel"><h2>Admin sign in</h2><p>Use the email/password account you create in Supabase Authentication.</p><label>Email</label><input id="email" type="email" autocomplete="username" placeholder="admin@example.com"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button class="primary-button" id="login">Sign in</button><div class="status" id="login-status" role="status"></div></section>
<section class="admin-card hidden" id="manager"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><h2>Add a question</h2><button id="logout" class="text-button">Sign out</button></div>
<form id="question-form"><input type="hidden" id="question-id"><label>Question</label><textarea id="q" required placeholder="Type the question"></textarea><div class="admin-grid"><div><label>Topic</label><select id="topic"><option>Arithmetic</option><option>Algebra</option><option>Geometry</option><option>Number Systems</option><option>Modern Math</option><option>Time & Work</option></select></div><div><label>Difficulty</label><select id="difficulty"><option>Easy</option><option selected>Medium</option><option>Hard</option></select></div></div>
<div class="admin-grid"><div><label>Option A</label><input id="opt0" required></div><div><label>Option B</label><input id="opt1" required></div><div><label>Option C</label><input id="opt2" required></div><div><label>Option D</label><input id="opt3" required></div></div>
<label>Correct option</label><select id="answer"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select><label>Explanation</label><textarea id="explanation" required placeholder="Step-by-step solution"></textarea><label><input type="checkbox" id="published" checked style="width:auto"> Publish question for students</label><button class="primary-button" type="submit">Save question</button> <button class="text-button" type="button" id="clear-form">Clear form</button></form><div class="status" id="save-status" role="status"></div>
<h2>Existing questions</h2><div id="question-list"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
